name = "kayla-admin"
main = "worker.js"
compatibility_date = "2024-11-01"

# Which repo the admin commits to. (Secrets are set separately — see README.)
# Private storage for the sales dashboard (price list + sale record).
# One-time: `npx wrangler kv namespace create SALES` → paste the printed id below → redeploy.
[[kv_namespaces]]
binding = "SALES"
id = "c87b874683d84ab296e6c88047c7a604"

[vars]
GH_OWNER = "Kjcarabes"
GH_REPO = "kayla-portfolio"
GH_BRANCH = "main"
# Instagram-login path (no Facebook Page). For the Facebook-Page path instead,
# set this to "https://graph.facebook.com/v21.0".
IG_API_BASE = "https://graph.instagram.com/v21.0"
# Facebook Page posting always uses graph.facebook.com (separate from the IG path
# above — a Page post needs a Page token either way).
FB_API_BASE = "https://graph.facebook.com/v21.0"
# Cloudflare Web Analytics site tag (already public in the site's beacon).
CF_SITE_TAG = "c924106269a54cb584b22aaef454b221"

# Secrets (do NOT put these here — set with `wrangler secret put`):
#   GITHUB_TOKEN            — fine-grained PAT, this repo only, Contents: Read+Write
#   ADMIN_PASSWORD          — the password Kayla types to log into /admin
#   IG_USER_ID              — (optional) Instagram Business account ID, for auto-post
#   IG_ACCESS_TOKEN         — (optional) long-lived Instagram Graph API token
#   FB_PAGE_ID              — (optional) Facebook Page ID, for Page posts
#   FB_PAGE_TOKEN           — (optional) never-expiring Page access token
#                             (pages_manage_posts). See README §3b.
#   NEWSLETTER_SEND_URL     — (optional) the newsletter-send Apps Script /exec URL
#   NEWSLETTER_SEND_SECRET  — (optional) shared secret matching that script
#   CF_API_TOKEN            — (optional) Cloudflare API token, Account Analytics: Read
#   CF_ACCOUNT_ID           — (optional) Cloudflare account ID (for the analytics tab)
#   STRIPE_SECRET_KEY       — (optional) live key, for the Orders tab
#   GELATO_API_KEY          — (optional) Gelato API key, for print fulfilment
#   STRIPE_WEBHOOK_SECRET   — (optional) whsec_… for POST /stripe-webhook
#   GELATO_WEBHOOK_TOKEN    — (optional) shared token in the /gelato-webhook URL; Gelato
#                             doesn't sign its webhooks, so this token IS the auth
#   ORDER_NOTIFY_URL        — (optional) Apps Script /exec URL. ONLY set this once the
#                             script handles action:'notify' — it falls through to a
#                             full mailing-list send otherwise. See README §5.
