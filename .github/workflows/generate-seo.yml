name: Generate SEO

# Regenerates sitemap.xml and the per-page JSON-LD / crawlable content fallbacks
# from the JSON sources, then commits the result. Mirrors the optimize-images /
# sync-products pattern: data-derived SEO is committed so the site stays plain
# static HTML with no runtime build step.

on:
  push:
    branches: [main]
    paths:
      - 'content/works.json'
      - 'content/blog.json'
      - 'content/shop-items.json'
      - 'content/products.json'
      - 'scripts/generate-seo.js'

  # Run after the bots that commit works.json / products.json, since their
  # GITHUB_TOKEN commits don't re-trigger the path filters above.
  workflow_run:
    workflows: ["Optimize images", "Sync Stripe Products"]
    types: [completed]

  # Daily safety net + manual trigger.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap, JSON-LD, and content fallbacks
        run: node scripts/generate-seo.js

      - name: Check for changes
        id: changes
        run: |
          git add sitemap.xml index.html work.html shop.html blog.html
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # [skip ci] keeps this commit from re-triggering other workflows.
          git commit -m "Update SEO metadata [skip ci]"
          git push
